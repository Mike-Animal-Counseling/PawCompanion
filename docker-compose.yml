services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: paw
      MONGO_INITDB_ROOT_PASSWORD: pawcompanion-local-mongo-password
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok", "-u", "paw", "-p", "pawcompanion-local-mongo-password", "--authenticationDatabase", "admin"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      HOST: 0.0.0.0
      MONGO_URI: mongodb://paw:pawcompanion-local-mongo-password@mongo:27017/pawcompanion?authSource=admin
      JWT_SECRET: pawcompanion-local-demo-only-please-change-2026
      CORS_ORIGIN: http://localhost:8080,http://127.0.0.1:8080
      APP_URL: http://localhost:8080
      PAYMENTS_MODE: sandbox
      ENABLE_AI: "false"
      DEMO_MODE: "true"
      LOG_LEVEL: info
    command: ["sh", "-c", "node src/scripts/seed.js --reset && node src/server.js"]
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "5000"

  web:
    build:
      context: ./frontend
      args:
        VITE_SHOW_DEMO_CREDENTIALS: "true"
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo-data:
  uploads:
